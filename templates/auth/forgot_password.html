<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lupa Password - Pasar Remboken</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

    <div class="w-full max-w-md">

        <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8">

            <!-- HEADER -->
            <div class="text-center mb-8">

                <div
                    class="w-16 h-16 mx-auto mb-4 rounded-2xl
                           bg-emerald-100 text-emerald-600
                           flex items-center justify-center"
                >
                    <i class="fa-solid fa-lock text-2xl"></i>
                </div>

                <h1 class="text-2xl font-bold text-slate-800">
                    Lupa Password?
                </h1>

                <p class="text-sm text-slate-500 mt-2">
                    Masukkan email atau nomor WhatsApp akun Anda untuk menerima kode OTP.
                </p>

            </div>

            <!-- FORM -->
            <form
                id="forgotPasswordForm"
                method="POST"
            >

                <div class="mb-5">

                    <label
                        for="identifier"
                        class="block text-sm font-semibold text-slate-700 mb-2"
                    >
                        Email atau Nomor WhatsApp
                    </label>

                    <div class="relative">

                        <i
                            id="inputIcon"
                            class="fa-solid fa-envelope absolute left-4 top-1/2
                                   -translate-y-1/2 text-slate-400"
                        ></i>

                        <input
                            type="text"
                            id="identifier"
                            name="identifier"
                            required
                            autocomplete="username"
                            placeholder="Email atau nomor WhatsApp"
                            class="w-full pl-11 pr-4 py-3 border border-slate-300
                                   rounded-xl outline-none focus:ring-2
                                   focus:ring-emerald-500 focus:border-emerald-500"
                        >

                    </div>

                    <p class="text-xs text-slate-400 mt-2">
                        Gunakan email terdaftar atau nomor WhatsApp yang terhubung dengan akun Anda.
                    </p>

                </div>

                <button
                    type="submit"
                    id="submitButton"
                    class="w-full bg-emerald-600 hover:bg-emerald-700
                           text-white font-bold py-3 rounded-xl transition
                           flex items-center justify-center gap-2"
                >
                    <i class="fa-solid fa-paper-plane"></i>
                    Kirim Kode OTP
                </button>

            </form>

            <!-- BACK TO LOGIN -->
            <div class="text-center mt-6">

                <a
                    href="{{ url_for('login') }}"
                    class="text-sm font-semibold text-slate-600
                           hover:text-emerald-600 transition"
                >
                    <i class="fa-solid fa-arrow-left mr-1"></i>
                    Kembali ke Login
                </a>

            </div>

        </div>

        <p class="text-center text-xs text-slate-400 mt-5">
            Pasar Remboken
        </p>

    </div>

    <script>
        document
            .getElementById("forgotPasswordForm")
            .addEventListener("submit", async function (e) {

                e.preventDefault();

                const form = this;
                const button = document.getElementById("submitButton");

                button.disabled = true;

                button.innerHTML = `
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    Mengirim OTP...
                `;

                try {

                    const response = await fetch(
                        "{{ url_for('forgot_password') }}",
                        {
                            method: "POST",
                            body: new FormData(form)
                        }
                    );

                    const data = await response.json();

                    if (response.ok && data.success) {

                        await Swal.fire({
                            icon: "success",
                            title: "OTP Terkirim",
                            text: data.message,
                            confirmButtonText: "Lanjut",
                            confirmButtonColor: "#059669"
                        });

                        window.location.href = data.redirect;

                    } else {

                        await Swal.fire({
                            icon: "error",
                            title: "Gagal",
                            text: data.message || "Gagal mengirim kode OTP.",
                            confirmButtonColor: "#dc2626"
                        });

                    }

                } catch (error) {

                    await Swal.fire({
                        icon: "error",
                        title: "Terjadi Kesalahan",
                        text: "Tidak dapat terhubung ke server.",
                        confirmButtonColor: "#dc2626"
                    });

                } finally {

                    button.disabled = false;

                    button.innerHTML = `
                        <i class="fa-solid fa-paper-plane"></i>
                        Kirim Kode OTP
                    `;

                }

            });
    </script>

</body>
</html>
