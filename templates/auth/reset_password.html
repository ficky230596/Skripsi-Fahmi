{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<div class="min-h-screen bg-slate-100 flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-md">

        <!-- CARD -->
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">

            <!-- HEADER -->
            <div class="bg-teal-700 px-6 py-8 text-center">

                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-white/15 flex items-center justify-center">
                    <i class="fa-solid fa-lock text-white text-2xl"></i>
                </div>

                <h1 class="text-2xl font-bold text-white">
                    Reset Password
                </h1>

                <p class="text-teal-100 text-sm mt-2">
                    Buat password baru untuk akun Anda
                </p>

            </div>

            <!-- FORM -->
            <div class="p-6 sm:p-8">

                <form id="resetPasswordForm">

                    <!-- PASSWORD BARU -->
                    <div class="mb-5">

                        <label
                            for="password"
                            class="block text-sm font-semibold text-slate-700 mb-2"
                        >
                            Password Baru
                        </label>

                        <div class="relative">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                minlength="8"
                                required
                                autocomplete="new-password"
                                placeholder="Masukkan password baru"
                                class="w-full rounded-xl border border-slate-300 px-4 py-3 pr-12 text-sm outline-none transition focus:border-teal-500 focus:ring-2 focus:ring-teal-100"
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-teal-700 transition"
                            >
                                <i class="fa-solid fa-eye"></i>
                            </button>

                        </div>

                        <p class="text-xs text-slate-500 mt-2">
                            Password minimal 8 karakter.
                        </p>

                    </div>


                    <!-- KONFIRMASI PASSWORD -->
                    <div class="mb-6">

                        <label
                            for="password_confirmation"
                            class="block text-sm font-semibold text-slate-700 mb-2"
                        >
                            Konfirmasi Password
                        </label>

                        <div class="relative">

                            <input
                                type="password"
                                id="password_confirmation"
                                name="password_confirmation"
                                minlength="8"
                                required
                                autocomplete="new-password"
                                placeholder="Ulangi password baru"
                                class="w-full rounded-xl border border-slate-300 px-4 py-3 pr-12 text-sm outline-none transition focus:border-teal-500 focus:ring-2 focus:ring-teal-100"
                            >

                            <button
                                type="button"
                                id="toggleConfirmation"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-teal-700 transition"
                            >
                                <i class="fa-solid fa-eye"></i>
                            </button>

                        </div>

                    </div>


                    <!-- BUTTON -->
                    <button
                        type="submit"
                        id="resetButton"
                        class="w-full bg-teal-700 hover:bg-teal-800 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2"
                    >
                        <i class="fa-solid fa-key"></i>
                        Ubah Password
                    </button>

                </form>


                <!-- BACK TO LOGIN -->
                <div class="text-center mt-6">

                    <a
                        href="{{ url_for('login') }}"
                        class="text-sm font-semibold text-teal-700 hover:text-teal-800 hover:underline transition"
                    >
                        <i class="fa-solid fa-arrow-left mr-1"></i>
                        Kembali ke Login
                    </a>

                </div>

            </div>

        </div>


        <!-- INFO -->
        <div class="text-center mt-5 text-xs text-slate-500">
            <i class="fa-solid fa-shield-halved mr-1"></i>
            Pastikan password Anda aman dan tidak dibagikan kepada orang lain.
        </div>

    </div>

</div>


<!-- SWEETALERT2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>

    // ================================
    // TOGGLE PASSWORD
    // ================================

    function setupPasswordToggle(buttonId, inputId) {

        const button = document.getElementById(buttonId);
        const input = document.getElementById(inputId);

        button.addEventListener('click', function () {

            const icon = button.querySelector('i');

            if (input.type === 'password') {

                input.type = 'text';

                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');

            } else {

                input.type = 'password';

                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');

            }

        });

    }

    setupPasswordToggle(
        'togglePassword',
        'password'
    );

    setupPasswordToggle(
        'toggleConfirmation',
        'password_confirmation'
    );


    // ================================
    // RESET PASSWORD
    // ================================

    document
        .getElementById('resetPasswordForm')
        .addEventListener('submit', async function (e) {

            e.preventDefault();

            const password =
                document.getElementById('password').value;

            const passwordConfirmation =
                document.getElementById('password_confirmation').value;

            const button =
                document.getElementById('resetButton');


            // VALIDASI PASSWORD

            if (password.length < 8) {

                Swal.fire({
                    icon: 'warning',
                    title: 'Password terlalu pendek',
                    text: 'Password minimal 8 karakter.',
                    confirmButtonColor: '#0f766e'
                });

                return;
            }


            if (password !== passwordConfirmation) {

                Swal.fire({
                    icon: 'warning',
                    title: 'Password tidak cocok',
                    text: 'Konfirmasi password harus sama dengan password baru.',
                    confirmButtonColor: '#0f766e'
                });

                return;
            }


            // LOADING

            button.disabled = true;

            button.innerHTML = `
                <i class="fa-solid fa-spinner fa-spin"></i>
                Menyimpan...
            `;


            try {

                const formData = new FormData();

                formData.append(
                    'password',
                    password
                );

                formData.append(
                    'password_confirmation',
                    passwordConfirmation
                );


                const response = await fetch(
                    "{{ url_for('reset_password') }}",
                    {
                        method: 'POST',
                        body: formData
                    }
                );


                const data = await response.json();


                if (data.success) {

                    await Swal.fire({
                        icon: 'success',
                        title: 'Berhasil!',
                        text: data.message,
                        confirmButtonColor: '#0f766e',
                        confirmButtonText: 'Login'
                    });

                    window.location.href = data.redirect;

                } else {

                    Swal.fire({
                        icon: 'error',
                        title: 'Gagal',
                        text: data.message || 'Password gagal diubah.',
                        confirmButtonColor: '#0f766e'
                    });

                }

            } catch (error) {

                console.error(error);

                Swal.fire({
                    icon: 'error',
                    title: 'Terjadi Kesalahan',
                    text: 'Tidak dapat terhubung ke server.',
                    confirmButtonColor: '#0f766e'
                });

            } finally {

                button.disabled = false;

                button.innerHTML = `
                    <i class="fa-solid fa-key"></i>
                    Ubah Password
                `;

            }

        });

</script>

{% endblock %}
